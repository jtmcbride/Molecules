name: Validate production artifact
on:
  workflow_call:
    inputs:
      base-path:
        description: Absolute deployment path, including trailing slash
        required: true
        type: string
      artifact-name:
        description: Upload the validated production build when nonempty
        default: ''
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build and smoke-test root hosting
        if: inputs.base-path != '/'
        env:
          VITE_BASE_PATH: /
          PLAYWRIGHT_BASE_PATH: /
        run: |
          npm run build
          npm run test:e2e:built -- deployment.spec.ts
      - name: Build deployment artifact
        env:
          VITE_BASE_PATH: ${{ inputs.base-path }}
        run: npm run build
      - name: Test deployment artifact without rebuilding
        env:
          PLAYWRIGHT_BASE_PATH: ${{ inputs.base-path }}
        run: npm run test:e2e:built
      - name: Preserve validated artifact
        if: inputs.artifact-name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
